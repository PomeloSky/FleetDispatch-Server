# 每次推送與 PR：型別檢查，並對每一種主機實作執行相容性測試（conformance/api.test.mjs）。
name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-node:
    name: Docker／Node 版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - name: 啟動主機
        run: |
          FD_DATA_DIR="$RUNNER_TEMP/data" FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_PORT=8080 FD_HOST=127.0.0.1 node docker/src/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/info > /dev/null && break; sleep 1; done
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8080 FD_SETUP_TOKEN=ci-setup-token-0123456789 node --test conformance/api.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  cloudflare:
    name: Cloudflare Workers＋D1（wrangler 本機模式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: 啟動主機
        run: |
          printf 'FD_SETUP_TOKEN=ci-setup-token-0123456789\n' > cloudflare/.dev.vars
          npx wrangler dev --config cloudflare/wrangler.toml --local --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/v1/info > /dev/null && break; sleep 1; done
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8787 FD_SETUP_TOKEN=ci-setup-token-0123456789 node --test conformance/api.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/wrangler.log"
