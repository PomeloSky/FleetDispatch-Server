# 每次推送與 PR：型別檢查、網頁產生檔案的一致性，並對每一種主機實作執行相容性測試（conformance/）。
name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-node:
    name: Docker／Node 版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - name: 網頁的產生檔案與原始檔一致
        run: npm run check:web
      - name: 啟動主機
        run: |
          FD_DATA_DIR="$RUNNER_TEMP/data" FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_ADMIN_PATH=/console-ci FD_PORT=8080 FD_HOST=127.0.0.1 node docker/src/server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/info > /dev/null && break; sleep 1; done
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8080 FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_ADMIN_PATH=/console-ci node --test conformance/api.test.mjs conformance/web.test.mjs
      - name: 資料表遷移、網頁登入的期限與管理員的恢復（暫存資料庫）
        run: FD_LOCAL_VARIANTS=node node --test conformance/migration-node.test.mjs conformance/web-session-local.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  cloudflare:
    name: Cloudflare Workers＋D1（wrangler 本機模式）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: 啟動主機
        run: |
          printf 'FD_SETUP_TOKEN=ci-setup-token-0123456789\nFD_ADMIN_PATH=/console-ci\n' > cloudflare/.dev.vars
          npx wrangler dev --config cloudflare/wrangler.toml --local --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/v1/info > /dev/null && break; sleep 1; done
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8787 FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_ADMIN_PATH=/console-ci node --test conformance/api.test.mjs conformance/web.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/wrangler.log"

  php-sqlite:
    name: PHP 8.4＋SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          ini-values: error_reporting=-1
      - name: 檢查語法
        run: for f in php/src/*.php php/public/index.php php/config.sample.php; do php -l "$f"; done
      - name: 啟動主機
        run: |
          mkdir -p "$RUNNER_TEMP/php"
          printf "<?php\nreturn ['setup_token' => 'ci-setup-token-0123456789', 'db' => ['dsn' => 'sqlite:%s/php/fd.sqlite'], 'admin_path' => '/console-ci'];\n" "$RUNNER_TEMP" > "$RUNNER_TEMP/php/config.php"
          FD_PHP_CONFIG="$RUNNER_TEMP/php/config.php" php -S 127.0.0.1:8080 php/public/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/info > /dev/null && break; sleep 1; done
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8080 FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_ADMIN_PATH=/console-ci node --test conformance/api.test.mjs conformance/web.test.mjs
      - name: 安裝精靈（SQLite；沒有 config.php 的程式資料夾）
        run: |
          cp -R php "$RUNNER_TEMP/php-app"
          php -S 127.0.0.1:8081 "$RUNNER_TEMP/php-app/public/index.php" > "$RUNNER_TEMP/php-install.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          FD_BASE=http://127.0.0.1:8081 FD_APP_DIR="$RUNNER_TEMP/php-app" FD_INSTALL_DB=sqlite node --test conformance/php-install.test.mjs
      - name: 資料表遷移、網頁登入的期限與管理員的恢復（暫存資料庫）
        run: FD_LOCAL_VARIANTS=php node --test conformance/migration-php.test.mjs conformance/web-session-local.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/php.log" "$RUNNER_TEMP/php-install.log" || true

  php-mysql:
    name: PHP ${{ matrix.php }}＋${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            db: mysql:8.0
          - php: '8.4'
            db: mariadb:10.6
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: fleetdispatch
          MYSQL_USER: fleetdispatch
          MYSQL_PASSWORD: fd-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          ini-values: error_reporting=-1
      - name: 啟動主機
        run: |
          mkdir -p "$RUNNER_TEMP/php"
          printf "<?php\nreturn ['setup_token' => 'ci-setup-token-0123456789', 'db' => ['dsn' => 'mysql:host=127.0.0.1;port=3306;dbname=fleetdispatch;charset=utf8mb4', 'user' => 'fleetdispatch', 'password' => 'fd-ci-password'], 'admin_path' => '/console-ci'];\n" > "$RUNNER_TEMP/php/config.php"
          FD_PHP_CONFIG="$RUNNER_TEMP/php/config.php" php -S 127.0.0.1:8080 php/public/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/info > /dev/null && break; sleep 1; done
          curl -s http://127.0.0.1:8080/api/v1/info
      - name: 相容性測試
        run: FD_BASE=http://127.0.0.1:8080 FD_SETUP_TOKEN=ci-setup-token-0123456789 FD_ADMIN_PATH=/console-ci node --test conformance/api.test.mjs conformance/web.test.mjs
      - name: 安裝精靈（另一個空的資料庫；沒有 config.php 的程式資料夾）
        run: |
          docker exec ${{ job.services.db.id }} mysql -uroot -proot-ci -e "CREATE DATABASE fd_install CHARACTER SET utf8mb4; GRANT ALL PRIVILEGES ON fd_install.* TO 'fleetdispatch'@'%'; FLUSH PRIVILEGES;"
          cp -R php "$RUNNER_TEMP/php-app"
          php -S 127.0.0.1:8081 "$RUNNER_TEMP/php-app/public/index.php" > "$RUNNER_TEMP/php-install.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          FD_BASE=http://127.0.0.1:8081 FD_APP_DIR="$RUNNER_TEMP/php-app" FD_INSTALL_DB=mysql FD_DB_HOST=127.0.0.1 FD_DB_PORT=3306 FD_DB_NAME=fd_install FD_DB_USER=fleetdispatch FD_DB_PASSWORD=fd-ci-password node --test conformance/php-install.test.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/php.log" "$RUNNER_TEMP/php-install.log" || true
